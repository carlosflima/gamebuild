name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Resolve app version
        id: app_version
        shell: bash
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "Não foi possível localizar versionName em app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Game-Builds-${version_name}-debug" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build hardened release
        run: gradle assembleRelease
      - name: Prepare branded APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${{ steps.app_version.outputs.artifact_name }}.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app_version.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/${{ steps.app_version.outputs.artifact_name }}.apk
          if-no-files-found: error
