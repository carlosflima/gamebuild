name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build hardened release
        run: gradle assembleRelease
      - name: Prepare branded APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Game-Builds-0.3.5-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Game-Builds-0.3.5-debug
          path: app/build/outputs/apk/debug/Game-Builds-0.3.5-debug.apk
          if-no-files-found: error
