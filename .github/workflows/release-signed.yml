name: Signed Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag existente da release (ex.: v0.3.5)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    env:
      GAMEBUILDS_KEYSTORE_BASE64: ${{ secrets.GAMEBUILDS_KEYSTORE_BASE64 }}
      GAMEBUILDS_KEYSTORE_PASSWORD: ${{ secrets.GAMEBUILDS_KEYSTORE_PASSWORD }}
      GAMEBUILDS_KEY_ALIAS: ${{ secrets.GAMEBUILDS_KEY_ALIAS }}
      GAMEBUILDS_KEY_PASSWORD: ${{ secrets.GAMEBUILDS_KEY_PASSWORD }}

    steps:
      - name: Validate requested tag format
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "A tag deve seguir o formato v<versionName>, por exemplo v0.3.5." >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "A tag informada não aponta para um commit pertencente ao histórico da main." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate app version against tag
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "Não foi possível localizar versionName/versionCode em app/build.gradle.kts." >&2
            exit 1
          fi

          expected_tag="v${version_name}"
          if [[ '${{ inputs.release_tag }}' != "$expected_tag" ]]; then
            echo "Tag incompatível: esperado $expected_tag para versionName=$version_name." >&2
            exit 1
          fi

          if (( version_code < 1 )); then
            echo "versionCode deve ser maior que zero." >&2
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "artifact_base=Game-Builds-${version_name}-signed-release" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets and reconstruct keystore
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$GAMEBUILDS_KEYSTORE_BASE64" ]] && missing+=(GAMEBUILDS_KEYSTORE_BASE64)
          [[ -z "$GAMEBUILDS_KEYSTORE_PASSWORD" ]] && missing+=(GAMEBUILDS_KEYSTORE_PASSWORD)
          [[ -z "$GAMEBUILDS_KEY_ALIAS" ]] && missing+=(GAMEBUILDS_KEY_ALIAS)
          [[ -z "$GAMEBUILDS_KEY_PASSWORD" ]] && missing+=(GAMEBUILDS_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            printf 'Secrets ausentes: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/gamebuild-release.jks"
          printf '%s' "$GAMEBUILDS_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "O keystore reconstruído está vazio." >&2
            exit 1
          fi
          echo "GAMEBUILDS_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease bundleRelease

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab"

      - name: Prepare checksummed release artifacts
        id: prepare_artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_base='${{ steps.release_version.outputs.artifact_base }}'
          artifact_dir="$RUNNER_TEMP/signed-release-artifacts"
          mkdir -p "$artifact_dir"

          cp app/build/outputs/apk/release/app-release.apk "$artifact_dir/${artifact_base}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$artifact_dir/${artifact_base}.aab"

          (
            cd "$artifact_dir"
            sha256sum "${artifact_base}.apk" "${artifact_base}.aab" > SHA256SUMS.txt
          )

          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release_version.outputs.artifact_base }}
          path: |
            ${{ steps.prepare_artifacts.outputs.artifact_dir }}/${{ steps.release_version.outputs.artifact_base }}.apk
            ${{ steps.prepare_artifacts.outputs.artifact_dir }}/${{ steps.release_version.outputs.artifact_base }}.aab
            ${{ steps.prepare_artifacts.outputs.artifact_dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${GAMEBUILDS_KEYSTORE_PATH:-}" ]]; then
            rm -f "$GAMEBUILDS_KEYSTORE_PATH"
          else
            rm -f "$RUNNER_TEMP/gamebuild-release.jks"
          fi
